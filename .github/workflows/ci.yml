name: CI

on:
  push:
    branches: [ main, uat ]
  pull_request:
    branches: [ main, uat ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: TypeScript check
      run: npx tsc --noEmit

    - name: Check hooks
      run: node scripts/check-hooks.mjs

    - name: Check i18n keys
      run: npm run check:i18n

    - name: Run tests
      run: npm test
