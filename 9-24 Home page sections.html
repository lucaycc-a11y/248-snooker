<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SPACE8 · 每個細節，都讓你專注於桌球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#111113; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
  --ink:#F5F5F7; --dim:#A1A1A6; --green:#22C55E; --green-l:#4ADE80;
  --body:"IBM Plex Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;
  min-height:100vh;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}

/* ---------- top ---------- */
.nav{display:flex;align-items:center;gap:12px;max-width:1280px;margin:0 auto;padding:22px 24px 0}
.brand{font-size:18px;font-weight:600;letter-spacing:.06em}
.nav .sp{flex:1}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{padding:7px 13px;font-size:12px;color:var(--dim)}
.langs button+button{border-left:1px solid var(--line)}
.langs button.on{background:var(--green);color:#04170B;font-weight:600}

/* ---------- section head ---------- */
.sec{padding:72px 0 90px}
.head{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:flex-end;gap:24px}
.head .txt{flex:1}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--green-l);text-transform:uppercase}
.h1{font-size:clamp(28px,4.6vw,52px);font-weight:700;line-height:1.16;letter-spacing:-.01em;margin-top:12px}
.arrows{display:flex;gap:12px;flex:0 0 auto}
.mbr{display:none}
.arr{width:46px;height:46px;border-radius:50%;background:#1D1D1F;display:grid;place-items:center;
  transition:background .2s ease,opacity .2s ease}
.arr:hover:not(:disabled){background:#2C2C2E}
.arr:disabled{opacity:.3;cursor:default}
.arr svg{width:18px;height:18px}

/* ---------- track ---------- */
.track{
  --edge:max(24px, calc((100vw - 1280px)/2 + 24px));
  display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
  padding:34px var(--edge) 12px;scroll-padding-inline:var(--edge);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.track::-webkit-scrollbar{display:none}

/* ---------- card ---------- */
.card{
  position:relative;flex:0 0 auto;width:clamp(270px,28vw,372px);aspect-ratio:372/540;
  border-radius:26px;overflow:hidden;scroll-snap-align:start;background:var(--card);
  transform:translateZ(0);transition:transform .35s cubic-bezier(.2,.8,.3,1);
}
.card:hover{transform:scale(1.012)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.28) 32%,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%)}
/* landscape screenshot: show it whole on a dark stage instead of cropping it */
.card.contain{background:radial-gradient(120% 90% at 50% 70%,#1b1a2e 0%,#0b0b10 70%)}
.card.contain img{object-fit:contain;padding:0 14px;top:18%;height:74%}
.cap{position:absolute;left:0;right:0;top:0;padding:26px 26px 0}
.cat{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.78);letter-spacing:.02em}
.ttl{font-size:clamp(21px,2.1vw,27px);font-weight:700;line-height:1.3;margin-top:8px;text-wrap:balance;
  text-shadow:0 2px 18px rgba(0,0,0,.45)}
.plus{position:absolute;right:18px;bottom:18px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;
  transition:transform .2s ease}
.plus:hover{transform:scale(1.08)}
.plus svg{width:15px;height:15px}

/* ---------- dots ---------- */
.dots{display:flex;justify-content:center;gap:8px;margin-top:26px}
.dots i{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.25);transition:width .3s ease,background .3s ease}
.dots i.on{width:22px;background:var(--green)}

/* ---------- detail modal ---------- */
.veilM{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:22px}
.veilM.on{display:flex}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#161618;border:1px solid var(--line);
  border-radius:24px;display:grid;grid-template-columns:1fr 1fr}
.modal .ph{position:relative;min-height:340px;background:#0b0b10}
.modal .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.modal .ph.contain img{object-fit:contain;padding:18px}
.modal .bd{padding:30px 28px;position:relative}
.modal .x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:15px}
.modal .cat{color:var(--green-l)}
.modal .ttl{text-shadow:none;margin-top:10px}
.modal p{font-size:14.5px;color:var(--dim);line-height:1.9;margin-top:16px}


/* ================= pricing (light grey, matches reference) ================= */
.price-sec{background:#F4F4F6;color:#111;padding:96px 24px 120px;text-align:center}
.price-sec .kicker{letter-spacing:.24em;color:#6B7280;font-weight:600}
.price-sec .h1{margin-top:10px;color:#111}
.psub{font-size:15.5px;color:#4B5563;margin-top:14px;line-height:1.8}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1120px;margin:52px auto 0;text-align:center}
.plan{background:#fff;border:1px solid #ECECEF;border-radius:22px;padding:40px 28px 34px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  transition:box-shadow .25s ease,transform .25s ease}
.plan:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 36px rgba(0,0,0,.08)}
.pico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:var(--tint)}
.pico svg{width:24px;height:24px}
.pname{font-size:20px;font-weight:700;margin-top:18px;color:#111}
.ptime{font-size:13.5px;color:#9CA3AF;margin-top:8px;font-variant-numeric:tabular-nums}
.pamt{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin-top:26px;line-height:1;color:#111}
.pamt .cur{font-family:"Michroma",sans-serif;font-size:22px;margin-top:8px}
.pamt .num{font-family:"Michroma",sans-serif;font-size:clamp(48px,5vw,62px);letter-spacing:.01em}
.pamt .per{align-self:flex-end;font-size:13px;color:#6B7280;margin-bottom:4px;margin-left:4px}
.pbtn{display:block;width:100%;margin-top:30px;padding:15px;border-radius:999px;font-size:15px;
  font-weight:600;text-align:center;text-decoration:none;background:var(--acc);color:#fff;
  transition:filter .2s ease,transform .15s ease}
.pbtn:hover{filter:brightness(1.08)}
.pbtn:active{transform:scale(.98)}
.plan.gold   {--tint:#F3E8FF;--acc:#9333EA}
.plan.morning{--tint:#F3F4F6;--acc:#6B7280}
.plan.noon   {--tint:#DCFCE7;--acc:#16A34A}
@media (max-width:900px){ .plans{grid-template-columns:1fr;max-width:420px;margin-left:auto;margin-right:auto} }

@media (max-width:640px){
  .sec{padding:52px 0 70px}
  .arrows{display:none}
  .mbr{display:inline}
  .track{gap:14px}
  .card{width:78vw}
  .modal{grid-template-columns:1fr}
  .modal .ph{min-height:260px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="nav">
  <span class="brand">SPACE8</span>
  <div class="sp"></div>
  <div class="langs">
    <button data-l="zh-TW" class="on">繁中</button>
    <button data-l="zh-CN">简中</button>

</div>

      <button class="arr" id="next" aria-label="next">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
</section>

</div>

let LANG="zh-TW";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const track=$("#track");
const PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

/* Chinese titles break at the comma, never mid-phrase; English wraps naturally */
function fmtTitle(x){ return LANG==="en" ? x : x.replace(/，/g,"，<br>"); }

const PICO={
 gold:'<svg viewBox="0 0 24 24" fill="none" stroke="#9333EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M17 4.5v2M16 5.5h2"/></svg>',
 morning:'<svg viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
 noon:'<svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M13 7l-3 5h4l-3 5"/></svg>'
};
function renderPricing(){
  const L=I18N[LANG];
  $("#pH").textContent=L.pH; $("#pSub").textContent=L.pSub;
  const g=$("#plans"); g.innerHTML="";
  L.plans.forEach(pl=>{
    const c=document.createElement("div"); c.className="plan "+pl.k;
    c.innerHTML=`<div class="pico">${PICO[pl.k]}</div>
      <div class="pname">${pl.name}</div>
      <div class="ptime">${pl.time}</div>
      <div class="pamt"><span class="cur">$</span><span class="num">${pl.price}</span><span class="per">${L.per}</span></div>
      <a class="pbtn" href="https://www.space8.com.hk">${L.book}</a>`;
    g.appendChild(c);
  });
}

function render(){
  const L=I18N[LANG];
  document.documentElement.lang = LANG==="en"?"en":(LANG==="zh-TW"?"zh-Hant":"zh-Hans");
  document.title="SPACE8 · "+L.h1;
  $("#kicker").textContent=L.kicker;
  $("#h1").innerHTML = LANG==="en" ? L.h1 : L.h1.replace("，","，<br class=\"mbr\">");
  track.innerHTML="";
  L.cards.forEach((c,i)=>{
    const el=document.createElement("article");
    el.className="card"+(c.contain?" contain":"");
    el.innerHTML=`<img src="${IMG[c.img]}" alt="${c.ttl}" loading="lazy">
      <div class="veil"></div>
      <div class="cap"><div class="cat">${c.cat}</div><h2 class="ttl">${fmtTitle(c.ttl)}</h2></div>
      <button class="plus" aria-label="more">${PLUS}</button>`;
    el.querySelector(".plus").onclick=()=>openCard(i);
    track.appendChild(el);
  });
  const d=$("#dots"); d.innerHTML="";
  L.cards.forEach(()=>d.appendChild(document.createElement("i")));
  $$(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  track.scrollLeft=0; sync();
  renderPricing();
}

function step(){ const c=track.querySelector(".card"); return c?c.getBoundingClientRect().width+20:300; }
$("#prev").onclick=()=>track.scrollBy({left:-step(),behavior:"smooth"});
$("#next").onclick=()=>track.scrollBy({left:step(),behavior:"smooth"});

function sync(){
  const max=track.scrollWidth-track.clientWidth;
  $("#prev").disabled = track.scrollLeft<=4;
  $("#next").disabled = track.scrollLeft>=max-4;
  const n=I18N[LANG].cards.length;
  const idx = max<=0 ? 0 : Math.round(track.scrollLeft/max*(n-1));
  $$("#dots i").forEach((e,i)=>e.classList.toggle("on",i===idx));
}
track.addEventListener("scroll",()=>requestAnimationFrame(sync),{passive:true});
window.addEventListener("resize",sync);
document.addEventListener("keydown",e=>{
  if($("#veil").classList.contains("on")){ if(e.key==="Escape")closeCard(); return; }
  if(e.key==="ArrowRight")$("#next").click();
  if(e.key==="ArrowLeft")$("#prev").click();
});

function openCard(i){
  const c=I18N[LANG].cards[i];
  $("#mImg").src=IMG[c.img]; $("#mImg").alt=c.ttl;
  $("#mPh").className="ph"+(c.contain?" contain":"");
  $("#mCat").textContent=c.cat; $("#mTtl").textContent=c.ttl; $("#mTxt").textContent=c.txt;
  $("#veil").classList.add("on");
}
function closeCard(){ $("#veil").classList.remove("on"); }
$("#mClose").onclick=closeCard;
$("#veil").onclick=e=>{ if(e.target.id==="veil")closeCard(); };

$$(".langs button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;render()});
render();
</script>
