<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0E">
<title>會員卡 · SPACE8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B0E; --ink:#F1F3F6; --muted:#8C93A0; --edge:rgba(255,255,255,.12);
  --wide:"Michroma","IBM Plex Sans TC",sans-serif;
  --body:"IBM Plex Sans TC","PingFang TC",-apple-system,sans-serif;
  --code:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding:calc(64px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #C9D3E6;outline-offset:4px;border-radius:10px}

.langs{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:10;display:flex;gap:2px;padding:3px;
  border:1px solid var(--edge);border-radius:999px;background:rgba(10,11,14,.7);backdrop-filter:blur(8px)}
.langs button{padding:5px 11px;font-size:12px;color:var(--muted);border-radius:999px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}

.stack{width:min(100%,560px);margin:0 auto;display:flex;flex-direction:column;gap:40px}
.cap{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;align-items:baseline}
.cap b{color:var(--ink);font-weight:600;font-size:14px}

/* ---------- card (theme via custom properties) ---------- */
.card{
  position:relative;border-radius:24px;overflow:hidden;padding:clamp(20px,4.5vw,28px);
  background:radial-gradient(120% 90% at 0% 0%,var(--sheen),transparent 55%),var(--surface);
  border:1px solid var(--rim);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 70px rgba(0,0,0,.55);
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;column-gap:clamp(14px,4vw,24px);row-gap:22px;
}
.head{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.logo{height:clamp(13px,3vw,16px);width:auto;display:block;opacity:.92}
.head .sp{flex:1}
.tier{display:inline-flex;align-items:center;gap:7px;padding:8px 15px 8px 12px;border-radius:999px;
  background:var(--pill);color:var(--pill-ink);font-size:13.5px;font-weight:600;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.3)}
.tier svg{width:15px;height:15px}
.who{align-self:end;min-width:0;padding-bottom:2px}
.label{font-size:10.5px;letter-spacing:.14em;color:var(--accent);opacity:.75}
.name{font-family:var(--wide);font-size:clamp(20px,5.2vw,32px);line-height:1.15;text-transform:uppercase;
  word-break:break-word;margin-top:6px}
.idsmall{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.5}
.idsmall code{display:block;font-family:var(--code);font-size:12.5px;color:var(--accent);letter-spacing:.04em;margin-top:2px}
.qrcol{display:flex;flex-direction:column;align-items:center;gap:9px}
.qrbtn{width:clamp(108px,30vw,150px);aspect-ratio:1;border-radius:16px;background:#fff;padding:5px;
  box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 1px var(--rim);transition:transform .15s ease}
.qrbtn img{width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:11px}
.qrbtn:active{transform:scale(.97)}
.zoomhint{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.zoomhint svg{width:12px;height:12px}

/* 標準 — slate & silver */
.t-std{--surface:linear-gradient(150deg,#2B3039 0%,#1B1E24 55%,#23272F 100%);--sheen:rgba(255,255,255,.07);
  --rim:rgba(255,255,255,.12);--pill:linear-gradient(180deg,#A2AEC4,#7F8BA2);--pill-ink:#fff;--accent:#C7CDD8}
/* 優越 — deep emerald, SPACE8 green */
.t-prm{--surface:linear-gradient(150deg,#16463A 0%,#0A211B 55%,#11342B 100%);--sheen:rgba(94,234,170,.12);
  --rim:rgba(94,234,170,.22);--pill:linear-gradient(180deg,#5EDBA4,#1F9A63);--pill-ink:#fff;--accent:#9FE7C6}
/* 尊榮 — obsidian & champagne gold */
.t-prs{--surface:linear-gradient(150deg,#2A241B 0%,#0E0C09 55%,#1D1913 100%);--sheen:rgba(240,210,140,.13);
  --rim:rgba(230,203,138,.34);--pill:linear-gradient(180deg,#F3DDA6,#C29A4A);--pill-ink:#2A1E08;--accent:#E8CD8C}
.t-prs .logo{filter:sepia(.55) saturate(1.6) brightness(1.02)}

/* ---------- enlarged view ---------- */
.zoom{position:fixed;inset:0;z-index:50;background:#fff;color:#0A0B0E;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.zoom.on{display:flex}
.zoom img{width:min(82vw,62vh,420px);aspect-ratio:1;image-rendering:pixelated}
.zoom .zname{font-family:var(--wide);font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.zoom .zid{font-family:var(--code);font-weight:600;font-size:clamp(15px,4.2vw,20px);letter-spacing:.06em;color:#333}
.zoom .ztip{font-size:12.5px;color:#6B7280}
.zoom .zclose{margin-top:4px;padding:12px 26px;border-radius:999px;border:1px solid #D4D8DF;font-size:14px;font-weight:600;min-height:44px}
@media (max-width:360px){ .card{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="langs" role="group" aria-label="Language">
  <button data-l="zh-TW" aria-pressed="true">繁</button>
  <button data-l="zh-CN" aria-pressed="false">简</button>
  <button data-l="en" aria-pressed="false">EN</button>
</div>

<main class="stack" id="stack"></main>

<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-labelledby="zName">
  <img id="zImg" alt="">
  <div class="zname" id="zName"></div>
  <div class="zid" id="zId"></div>
  <div class="ztip" id="zTip"></div>
  <button class="zclose" id="zClose"></button>
</div>

/* demo member shown on all three tiers so the colours can be compared */
const NAME="Mike Lau";
const CARDS=[
  {k:"std", id:"SPACE8-STD-4827-3916", icon:"spark"},
  {k:"prm", id:"SPACE8-PRM-4827-3916", icon:"trophy"},
  {k:"prs", id:"SPACE8-PRS-4827-3916", icon:"diamond"}
];
const ICON={
 spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18.5 9.5l-4.9 1.6L12 16l-1.6-4.9L5.5 9.5l4.9-1.6z"/><path d="M19 15l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg>',
 trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 002.5 3.5M17 6h2.5A2.5 2.5 0 0117 9.5"/></svg>',
 diamond:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3l3 18M15 3l-3 18"/></svg>'
};
const EXPAND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';

const I18N={
 "zh-TW":{ title:"會員卡 · SPACE8", tiers:{std:"標準會員",prm:"優越會員",prs:"尊榮會員"},
   label:"MEMBER CARD", idLbl:"會員編號", hint:"點擊放大", qrAlt:"會員 QR Code，點擊放大",
   tip:"掃描時請把螢幕亮度調高", close:"關閉" },
 "zh-CN":{ title:"会员卡 · SPACE8", tiers:{std:"标准会员",prm:"优越会员",prs:"尊荣会员"},
   label:"MEMBER CARD", idLbl:"会员编号", hint:"点击放大", qrAlt:"会员二维码，点击放大",
   tip:"扫描时请把屏幕亮度调高", close:"关闭" },
 "en":{ title:"Member card · SPACE8", tiers:{std:"Standard",prm:"Premier",prs:"Prestige"},
   label:"MEMBER CARD", idLbl:"Member ID", hint:"Tap to enlarge", qrAlt:"Member QR code, tap to enlarge",
   tip:"Turn your screen brightness up to scan", close:"Close" }
};
const EN_NAMES={std:"Standard",prm:"Premier",prs:"Prestige"};
let LANG="zh-TW";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function render(){
  const L=I18N[LANG];
  document.documentElement.lang = LANG==="en"?"en":(LANG==="zh-TW"?"zh-Hant":"zh-Hans");
  document.title=L.title;
  $("#stack").innerHTML=CARDS.map(c=>`
    <section>
      <div class="cap"><b>${L.tiers[c.k]}</b>${LANG==="en"?"":`<span>${EN_NAMES[c.k]}</span>`}</div>
      <article class="card t-${c.k}">
        <div class="head">
          <img class="logo" src="${LOGO_SRC}" alt="SPACE8">
          <div class="sp"></div>
          <div class="tier">${ICON[c.icon]}<span>${L.tiers[c.k]}</span></div>
        </div>
        <div class="who">
          <div class="label">${L.label}</div>
          <div class="name">${NAME}</div>
          <div class="idsmall">${L.idLbl}<code>${c.id}</code></div>
        </div>
        <div class="qrcol">
          <button class="qrbtn" data-id="${c.id}" aria-label="${L.qrAlt}" aria-haspopup="dialog"><img src="${QR_SRC}" alt=""></button>
          <div class="zoomhint">${EXPAND}<span>${L.hint}</span></div>
        </div>
      </article>
    </section>`).join("");
  $$(".qrbtn").forEach(b=>b.onclick=()=>openZoom(b));
  $("#zImg").src=QR_SRC; $("#zImg").alt=L.qrAlt;
  $("#zTip").textContent=L.tip; $("#zClose").textContent=L.close;
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===LANG)));
}

let lastBtn=null;
function openZoom(btn){ lastBtn=btn; $("#zName").textContent=NAME; $("#zId").textContent=btn.dataset.id;
  $("#zoom").classList.add("on"); $("#zClose").focus(); }
function closeZoom(){ $("#zoom").classList.remove("on"); if(lastBtn)lastBtn.focus(); }
$("#zoom").onclick=closeZoom;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#zoom").classList.contains("on"))closeZoom(); });
$$(".langs button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;render()});
render();
</script>
