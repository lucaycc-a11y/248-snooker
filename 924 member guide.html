<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050605">
<title>會員 · SPACE8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#050605;
  --felt:#0B5D34;
  --felt-deep:#073D22;
  --green:#22C55E;
  --green-ink:#15803D;
  --bone:#E8ECE7;
  --muted:#8A918B;
  --rule:rgba(232,236,231,.12);
  --paper:#F4F4F6;
  --paper-ink:#141614;
  --paper-muted:#5B625C;
  --paper-rule:#DEE1DE;
  --body:"IBM Plex Sans TC","PingFang TC","Noto Sans TC",-apple-system,sans-serif;
  --num:"Big Shoulders Display","IBM Plex Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--black);scroll-behavior:smooth}
body{background:var(--black);color:var(--bone);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:14px clamp(18px,4vw,40px);padding-top:calc(14px + env(safe-area-inset-top));
  background:rgba(5,6,5,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--rule)}
.back svg{width:17px;height:17px}
.brand{font-weight:700;letter-spacing:.08em;font-size:15px}
.bar .sp{flex:1}
.langs{display:flex;gap:2px;padding:3px;border:1px solid var(--rule);border-radius:999px}
.langs button{padding:6px 12px;font-size:12.5px;color:var(--muted);border-radius:999px}
.langs button[aria-pressed="true"]{background:var(--bone);color:var(--black);font-weight:600}

.frame{max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
section{padding:clamp(64px,9vw,112px) 0}
.h2{font-size:clamp(32px,4.6vw,52px);font-weight:700;line-height:1.14;letter-spacing:-.015em}
.lede{font-size:clamp(15px,1.3vw,17px);color:var(--muted);margin-top:14px;max-width:34em}

/* ---------- 1. tiers: one ladder, not three cards ---------- */
.note{margin-top:28px;display:inline-block;padding:12px 18px;border-left:3px solid var(--green);
  background:rgba(34,197,94,.06);font-size:14.5px;color:var(--bone)}
.note b{color:var(--green);font-weight:600}
.ladder{margin-top:clamp(40px,6vw,64px);display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.ladder::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;
  background:linear-gradient(90deg,var(--rule) 0%,var(--green) 100%)}
.tier{padding-right:28px;border-right:1px solid var(--rule)}
.tier:last-child{border-right:0;padding-right:0}
.tier + .tier{padding-left:28px}
.tnode{position:relative;display:flex;align-items:center;gap:10px;height:16px;margin-bottom:34px}
.tnode i{width:16px;height:16px;border-radius:50%;background:var(--black);border:2px solid var(--green);flex:0 0 auto}
.tier.top .tnode i{background:var(--green);box-shadow:0 0 0 6px rgba(34,197,94,.18)}
.tnode span{font-size:12.5px;color:var(--muted);background:var(--black);padding-right:8px}
.tbody{padding-bottom:6px}
.tier.top .tbody{margin:-22px 0 0 -22px;padding:22px 22px 26px;border-radius:18px;
  background:radial-gradient(140% 100% at 20% 0%,var(--felt) 0%,var(--felt-deep) 50%,rgba(7,61,34,.25) 100%)}
.mul{font-family:var(--num);font-weight:800;font-size:clamp(64px,8vw,104px);line-height:.9;letter-spacing:-.01em;color:var(--bone)}
.tier.top .mul{color:#fff}
.tname{font-size:21px;font-weight:700;margin-top:14px}
.tth{font-size:14px;color:var(--green);font-weight:600;margin-top:4px;min-height:1.5em}
.tlead{font-size:15.5px;margin-top:16px;line-height:1.7;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.tdet{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.85}
.tier.top .tdet{color:#B9C6BC}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;
  font-size:15px;font-weight:600;text-decoration:none;min-height:48px}
.btn.solid{background:var(--green);color:#03170A}
.btn.line{border:1px solid var(--rule);color:var(--bone)}
.btn.solid:hover{background:#34D46F}
.btn.line:hover{border-color:var(--bone)}

/* ---------- 2 & 4. connected flows ---------- */
.flow{list-style:none;margin-top:clamp(36px,5vw,56px);display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s}
.flow li{position:relative;padding:0 24px 0 0}
.flow li::before{content:"";position:absolute;left:44px;right:0;top:21px;height:1px;background:var(--rule)}
.flow li:last-child::before{display:none}
.num{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--green);color:var(--green);font-family:var(--num);font-weight:700;font-size:21px;background:var(--black)}
.ft{font-size:17px;font-weight:700;margin-top:20px}
.fd{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.85;max-width:20em}

/* ---------- 3. member access (light) ---------- */
.paper{background:var(--paper);color:var(--paper-ink)}
.paper .lede{color:var(--paper-muted)}
.access{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(36px,6vw,80px);align-items:start}
.access .h2{max-width:11em}
.uses{list-style:none;margin-top:36px;border-top:1px solid var(--paper-rule)}
.uses li{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--paper-rule)}
.uico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;
  border:1px solid var(--paper-rule);flex:0 0 auto}
.uico svg{width:20px;height:20px}
.utag{font-size:12px;color:var(--green-ink);font-weight:600}
.uname{font-size:16px;font-weight:600;line-height:1.35}
.h3{font-size:18px;font-weight:700;margin-top:44px}
.tips{list-style:none;margin-top:14px}
.tips li{position:relative;padding:10px 0 10px 20px;font-size:14px;color:var(--paper-muted);line-height:1.75;
  border-bottom:1px solid var(--paper-rule)}
.tips li:last-child{border-bottom:0}
.tips li::before{content:"";position:absolute;left:2px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--green-ink)}

/* the member card — the one bold element */
.b-find .h3{margin-top:36px}
.colR{padding-top:8px}
.mcard{position:relative;aspect-ratio:1.586;border-radius:22px;overflow:hidden;color:#fff;
  background:radial-gradient(90% 120% at 100% 0%,rgba(34,197,94,.42) 0%,rgba(11,93,52,.35) 32%,transparent 62%),
  linear-gradient(155deg,#141814 0%,#060806 70%);
  box-shadow:0 28px 60px rgba(8,20,12,.28),0 2px 6px rgba(0,0,0,.18);padding:clamp(18px,3vw,26px)}
.mc-brand{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:.06em;line-height:1}
.mc-sub{font-size:10.5px;letter-spacing:.2em;color:rgba(255,255,255,.55);margin-top:6px}
.mc-tier{position:absolute;top:clamp(18px,3vw,26px);right:clamp(18px,3vw,26px);text-align:right}
.mc-tier small{display:block;font-size:11px;color:rgba(255,255,255,.55)}
.mc-tier b{font-size:clamp(16px,2vw,21px);color:var(--green);font-weight:700}
.mc-holder{position:absolute;left:clamp(18px,3vw,26px);bottom:clamp(18px,3vw,26px)}
.mc-holder small{display:block;font-size:11px;color:rgba(255,255,255,.55)}
.mc-name{font-size:clamp(16px,2vw,20px);font-weight:700;margin-top:2px}
.mc-id{font-size:12px;color:var(--green);letter-spacing:.08em;margin-top:6px;font-weight:500}
.mc-qr{position:absolute;right:clamp(18px,3vw,26px);bottom:clamp(18px,3vw,26px);width:30%;aspect-ratio:1;
  background:#fff;border-radius:12px;padding:1%;overflow:hidden}
.mc-qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.mc-qr::after{content:"";position:absolute;inset:-4px;border-radius:15px;border:2px solid var(--green);
  animation:ring 2.4s ease-out 0.6s 2 both}
@keyframes ring{0%{opacity:0;transform:scale(.9)}40%{opacity:1}100%{opacity:0;transform:scale(1.18)}}
.cap{font-size:13px;color:var(--paper-muted);margin-top:14px}
.cap b{color:var(--green-ink);font-weight:600}
.steps{list-style:none;margin-top:28px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--paper-rule)}
.steps .sn{font-family:var(--num);font-weight:800;font-size:26px;line-height:1;color:var(--green-ink)}
.steps b{display:block;font-size:15.5px;font-weight:600}
.steps span{display:block;font-size:13.5px;color:var(--paper-muted);margin-top:4px;line-height:1.75}
.paper .actions{margin-top:40px}
.paper .btn.solid{background:var(--green-ink);color:#fff}
.paper .btn.solid:hover{background:#166534}
.paper .btn.line{border-color:#C9CEC9;color:var(--paper-ink);background:#fff}

/* ---------- 4. space pilot ---------- */
.pilot .h2{font-weight:700}

@media (max-width:900px){
  .ladder{grid-template-columns:1fr}
  .ladder::before{display:none}
  .tier,.tier+.tier{padding:0 0 28px;border-right:0;border-bottom:1px solid var(--rule);margin-bottom:28px}
  .tier.top{border-bottom:0}
  .tnode{margin-bottom:22px}
  .tier.top .tbody{margin:-10px 0 0;padding:22px 20px 26px}
  .flow{grid-template-columns:1fr 1fr;row-gap:36px}
  .flow li::before{display:none}
  .access{grid-template-columns:1fr}
  .access{display:flex;flex-direction:column;gap:0;align-items:stretch}
  .b-cta .btn{flex:1 1 100%}
  .colL,.colR{display:contents}
  .b-intro{order:1} .b-card{order:2;max-width:460px;margin-top:32px}
  .b-uses{order:3} .b-find{order:4} .b-tips{order:5} .b-cta{order:6}
}
@media (max-width:520px){
  .flow{grid-template-columns:1fr}
  .flow li{display:grid;grid-template-columns:44px 1fr;column-gap:16px}
  .flow li .ft{margin-top:9px}
  .flow li .fd{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="bar">
  <button class="back" id="back" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="brand">SPACE8</span>
  <div class="sp"></div>
  <div class="langs" role="group" aria-label="Language">
    <button data-l="zh-TW" aria-pressed="true">繁</button>
    <button data-l="zh-CN" aria-pressed="false">简</button>
    <button data-l="en" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <!-- 1. membership -->
  <section id="tiers">
    <div class="frame">
      <h2 class="h2" id="tH"></h2>
      <p class="lede" id="tSub"></p>
      <p class="note" id="tBanner"></p>
      <div class="ladder" id="ladder"></div>
      <div class="actions">
        <a class="btn solid" id="tBook" href="https://www.space8.com.hk"></a>
        <a class="btn line" id="tLogin" href="https://www.space8.com.hk"></a>
      </div>
    </div>
  </section>

  <!-- 2. points -->
  <section id="points">
    <div class="frame">
      <h2 class="h2" id="pH"></h2>
      <ol class="flow" id="pFlow"></ol>
    </div>
  </section>

  <!-- 3. member access -->
  <section id="access" class="paper">
    <div class="frame access">
      <div class="colL">
        <div class="b-intro"><h2 class="h2" id="qH"></h2><p class="lede" id="qSub"></p></div>
        <div class="b-uses"><h3 class="h3" id="s1"></h3><ul class="uses" id="uses"></ul></div>
        <div class="b-tips"><h3 class="h3" id="s3"></h3><ul class="tips" id="tips"></ul></div>
      </div>
      <div class="colR">
        <div class="b-card">
          <div class="mcard" role="img" id="mcard">
            <div class="mc-brand">SPACE8</div>
            <div class="mc-sub">MEMBER CARD</div>
            <div class="mc-tier"><small id="mcTierL"></small><b id="mcTier"></b></div>
            <div class="mc-holder">
              <small id="mcHolderL"></small>
              <div class="mc-name">Chan Tai Man</div>
              <div class="mc-id">SPACE8-PRM-0000-0</div>
            </div>
            <div class="mc-qr"><img id="qrImg" alt=""></div>
          </div>
          <p class="cap" id="qCap"></p>
        </div>
        <div class="b-find"><h3 class="h3" id="s2"></h3><ol class="steps" id="steps"></ol></div>
        <div class="b-cta actions">
          <a class="btn solid" id="ctaMember" href="https://www.space8.com.hk"></a>
          <a class="btn line" id="ctaRecord" href="space8-my-record.html"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. space pilot -->
  <section id="pilot" class="pilot">
    <div class="frame">
      <h2 class="h2">Space Pilot</h2>
      <p class="lede" id="spSub"></p>
      <ol class="flow" id="spFlow"></ol>
    </div>
  </section>
</main>

let LANG="zh-TW";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const flow=items=>items.map((x,i)=>`<li><span class="num">${i+1}</span><div class="ft">${x.t}</div><p class="fd">${x.d}</p></li>`).join("");

function render(){
  const L=I18N[LANG];
  document.documentElement.lang = LANG==="en"?"en":(LANG==="zh-TW"?"zh-Hant":"zh-Hans");
  document.title=L.title;
  $("#back").setAttribute("aria-label",L.back);

  $("#tH").textContent=L.tH; $("#tSub").textContent=L.tSub; $("#tBanner").innerHTML=L.tBanner;
  $("#ladder").innerHTML=L.tiers.map((x,i)=>`<div class="tier${i===2?" top":""}">
      <div class="tnode" aria-hidden="true"><i></i><span>${x.at} ${L.unit}</span></div>
      <div class="tbody"><div class="mul">${x.m}</div><div class="tname">${x.name}</div>
      <div class="tth">${x.th}</div><p class="tlead">${x.lead}</p><p class="tdet">${x.det}</p></div></div>`).join("");
  $("#tBook").textContent=L.tBook; $("#tLogin").textContent=L.tLogin;

  $("#pH").textContent=L.pH; $("#pFlow").innerHTML=flow(L.pts);

  $("#qH").innerHTML = LANG==="en" ? L.qH : L.qH.replace("，","，<br>"); $("#qSub").textContent=L.qSub; $("#qCap").innerHTML=L.qCap;
  $("#mcard").setAttribute("aria-label",L.cardAlt);
  $("#mcTierL").textContent=L.mcTierL; $("#mcTier").textContent=L.mcTier; $("#mcHolderL").textContent=L.mcHolderL;
  $("#s1").textContent=L.s1; $("#s2").textContent=L.s2; $("#s3").textContent=L.s3;
  $("#uses").innerHTML=L.uses.map(u=>`<li><span class="uico">${ICON[u.i]}</span><span><span class="utag">${u.p}</span><span class="uname" style="display:block">${u.t}</span></span></li>`).join("");
  $("#steps").innerHTML=L.steps.map((x,i)=>`<li><span class="sn">${i+1}</span><div><b>${x.t}</b><span>${x.d}</span></div></li>`).join("");
  $("#tips").innerHTML=L.tips.map(x=>`<li>${x}</li>`).join("");
  $("#ctaMember").textContent=L.ctaMember; $("#ctaRecord").textContent=L.ctaRecord;

  $("#spSub").textContent=L.spSub; $("#spFlow").innerHTML=flow(L.sp);
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===LANG)));
}

$("#qrImg").src=QR_SRC;
$$(".langs button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;render()});
$("#back").onclick=()=>{ if(history.length>1)history.back(); else location.href="https://www.space8.com.hk"; };
render();
</script>
