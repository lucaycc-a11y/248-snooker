<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060706">
<title>場地 · SPACE8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060706; --tile:#101311; --tile2:#141816; --edge:rgba(255,255,255,.08);
  --ink:#EEF1EE; --muted:#8E958F; --green:#22C55E; --green-soft:rgba(34,197,94,.12);
  --body:"IBM Plex Sans TC","PingFang TC","Noto Sans TC",-apple-system,sans-serif;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.6;
  padding:0 0 calc(40px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:8px}

.bar{display:flex;justify-content:flex-end;padding:calc(14px + env(safe-area-inset-top)) 16px 0;max-width:1120px;margin:0 auto}
.langs{display:flex;gap:2px;padding:3px;border:1px solid var(--edge);border-radius:999px}
.langs button{padding:5px 11px;font-size:12px;color:var(--muted);border-radius:999px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}

.wrap{max-width:1120px;margin:0 auto;padding:0 14px}
.head{padding:32px 4px 22px}
.h1{font-size:clamp(28px,7.4vw,48px);font-weight:700;line-height:1.18;letter-spacing:-.01em;max-width:13em;word-break:keep-all;overflow-wrap:anywhere}

/* ---------- bento: mobile first ---------- */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;border-radius:var(--r);background:var(--tile);border:1px solid var(--edge);
  min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.photo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.78) 100%)}
.txt{position:relative;z-index:1;margin-top:14px}
.cat{font-size:12px;font-weight:600;color:var(--green)}
.photo .cat{color:#7BE3A5}
.ttl{font-size:17px;font-weight:700;line-height:1.35;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}

/* layout slots (mobile) */
.t-room {grid-column:1/-1;aspect-ratio:4/3.1}
.t-balls{grid-row:span 2;min-height:0}
.t-scan,.t-smoke{min-height:clamp(170px,42vw,220px);justify-content:space-between}
.t-score{grid-column:1/-1;aspect-ratio:16/10;max-height:420px}
.t-sofa {grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px}

.t-room .ttl{font-size:clamp(20px,5.6vw,26px)}
.t-balls img{object-position:50% 58%}
.t-score{background:#0A0A0D}
.t-score img{object-fit:contain;padding:6px 6px 58px}

/* icon tiles */
.icon{width:clamp(66px,17vw,82px);height:clamp(66px,17vw,82px);border-radius:20px;flex:0 0 auto;display:grid;place-items:center;background:var(--green-soft);
  border:1px solid rgba(34,197,94,.26);margin-bottom:auto}
.icon svg{width:56%;height:56%}
.icon svg *{stroke-width:1.5}
.t-scan,.t-smoke{background:linear-gradient(160deg,var(--tile2),var(--tile))}
.t-scan .ttl,.t-smoke .ttl{font-size:15px}
.t-sofa .icon{margin:0;flex:0 0 auto;width:72px;height:72px;border-radius:20px}
.t-sofa{background:linear-gradient(120deg,#0E2A1B 0%,var(--tile) 70%);border-color:rgba(34,197,94,.18);padding:14px 16px}
.t-sofa .txt{margin-top:0}

/* ---------- tablet / desktop: 4-column bento ---------- */
@media (min-width:760px){
  .wrap{padding:0 28px}
  .head{padding:56px 0 30px}
  .bento{grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(clamp(190px,18vw,220px),auto);gap:14px}
  .tile{padding:22px;min-height:0;aspect-ratio:auto}
  .t-room {grid-column:1/3;grid-row:1/3}
  .t-balls{grid-column:3;grid-row:1/3}
  .t-scan {grid-column:4;grid-row:1}
  .t-smoke{grid-column:4;grid-row:2}
  .t-score{grid-column:1/3;grid-row:3}
  .t-sofa {grid-column:3/5;grid-row:3;flex-direction:column;align-items:flex-start;justify-content:flex-end}
  .t-sofa{padding:22px}
  .t-sofa .icon{margin-bottom:auto;width:clamp(66px,17vw,82px);height:clamp(66px,17vw,82px)}
  .t-sofa .txt{margin-top:14px}
  .t-scan,.t-smoke{min-height:0}
  .t-room .ttl{font-size:28px}
  .ttl{font-size:19px}
  .t-scan .ttl,.t-smoke .ttl{font-size:17px}
  .t-score img{padding:16px 16px 16px 50%;object-position:right center}
  .t-score .txt{max-width:46%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="langs" role="group" aria-label="Language">
    <button data-l="zh-TW" aria-pressed="true">繁</button>
    <button data-l="zh-CN" aria-pressed="false">简</button>
    <button data-l="en" aria-pressed="false">EN</button>
  </div>
</div>

<main class="wrap">
  <header class="head"><h1 class="h1" id="h1"></h1></header>
  <div class="bento" id="bento"></div>
</main>

    const media = x.img
      ? `<img src="${IMG[x.img]}" alt="${ALT[LANG][x.img]}">`
      : `<span class="icon" aria-hidden="true">${ICON[x.icon]}</span>`;
    return `<article class="tile t-${x.slot}${x.img?" photo":""}">${media}
      <div class="txt"><div class="cat">${p.c}</div><h2 class="ttl">${p.t}</h2></div></article>`;
  }).join("");
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===LANG)));
}
$$(".langs button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;render()});
render();
</script>
</body>
</html>
