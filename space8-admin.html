<title>Space8 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+HK:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout (follows DESIGN.md of the Space8 repo: black, brand green #25D366, radii 12/14/20, borders only): left rail + sticky top bar on desktop; top bar + bottom tab bar on phone. Detail opens as right drawer (desktop) or bottom sheet (phone). Space8 black with CTA green #22c55e, dark by default, borders only, no shadows. */
:root{
  --bg:#000000; --rail:#0a0a0a; --surface:#111111; --surface-2:#1a1a1a; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --fg:#ffffff; --fg-2:rgba(255,255,255,.72); --muted:rgba(255,255,255,.52);
  --accent:#25D366; --accent-hover:#1FB855; --accent-ink:#000000; --accent-soft:rgba(37,211,102,.12);
  --good:#25D366; --warn:#ffb340; --bad:#FF453A; --info:#64D2FF;
  --overlay:rgba(0,0,0,.72);
  --f-display:"Bebas Neue","Noto Sans HK","PingFang HK",system-ui,sans-serif;
  --f-body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px; --r-btn:14px; --r-sm:12px;
  color-scheme:dark;
}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{
  --bg:#f4f4f2; --rail:#ffffff; --surface:#ffffff; --surface-2:#efefec; --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.20);
  --fg:#0a0a0a; --fg-2:rgba(0,0,0,.72); --muted:rgba(0,0,0,.55);
  --accent:#128c4a; --accent-hover:#0e7a3f; --accent-ink:#ffffff; --accent-soft:rgba(18,140,74,.12);
  --good:#0f7a43; --warn:#a96a00; --bad:#d6291f; --info:#0a76a8; --overlay:rgba(10,10,10,.45); color-scheme:light}

*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .fg2{color:var(--fg-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;align-self:start;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:22px}
.brand{display:flex;align-items:center;padding:2px 8px;color:var(--fg)}
.brand svg{display:block;width:auto}
.logo-h svg{height:27px}.logo-m svg{height:26px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:1px solid transparent;border-radius:var(--r-sm);background:none;color:var(--fg-2);text-align:left;font-weight:500}
.nav button svg{flex:none}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line-2)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);padding:0 8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .brand{display:none}
.route{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.top h1{font:700 18px var(--f-body)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border:1px solid var(--line-2);border-radius:99px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.chip.demo{border-style:dashed}
.sel{min-height:44px;padding:0 12px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm)}
.page{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.bnav{display:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{padding:0;overflow:hidden}
.card h3{font:600 15px var(--f-body);margin-bottom:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.head h2{font:600 20px var(--f-body)}
.head .sub{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid var(--line-2);background:var(--surface-2);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.pill.mute{color:var(--muted);background:var(--surface-2)}
.pill.accent{color:var(--accent);background:var(--accent-soft)}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line-2);font-size:11px;color:var(--fg-2);white-space:nowrap}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-btn);overflow-x:auto;max-width:100%}
.seg button{flex:none;min-height:40px;padding:0 14px;border:0;border-radius:10px;background:none;color:var(--fg-2);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.3px}
.input,.field input,.field select,.field textarea{width:100%;min-height:44px;padding:10px 12px;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--fg)}
.field textarea{min-height:84px;resize:vertical}
.field input[type=checkbox]{width:20px;min-height:20px;height:20px}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);padding:10px 12px;border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);border-radius:var(--r-sm);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.note{font-size:13px;color:var(--fg-2);padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2)}
.note.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.switch{position:relative;width:52px;height:30px;flex:none;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--accent-ink)}
.switch[disabled]{opacity:.45;cursor:not-allowed}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--warn)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.stat b{font:400 38px/1.05 var(--f-display);letter-spacing:.5px}
.stat span{font-size:12px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.li-bk{grid-template-columns:96px minmax(0,1.3fr) minmax(0,1.2fr) 70px 90px 130px;grid-template-areas:"hc nm dt tb pr st"}
.li-bk.hd{font-size:12px;color:var(--muted);cursor:default}
.c-hc{grid-area:hc}.c-nm{grid-area:nm}.c-dt{grid-area:dt}.c-tb{grid-area:tb}.c-pr{grid-area:pr}.c-st{grid-area:st}
.c-dt .tbi{display:none}
.li-today{grid-template-columns:104px minmax(0,1fr) 120px}
.li-mem{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 100px 110px 120px}
.li-kv{grid-template-columns:140px minmax(0,1fr)}
.cell-main{font-weight:500;min-width:0;overflow-wrap:anywhere}
.cell-sub{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:12px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;justify-content:flex-end}
.ov.dlg{z-index:60;justify-content:center;align-items:center;padding:16px}
.sheet{width:min(560px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line-2);display:flex;flex-direction:column;min-height:0}
.dlgbox{width:min(560px,100%);max-height:92%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh-head h2{font:600 18px var(--f-body);overflow-wrap:anywhere}
.sh-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1}
.sh-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>h3{font:600 12px var(--f-body);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.bill{display:flex;flex-direction:column;gap:6px;font-size:13px}
.bill div{display:flex;justify-content:space-between;gap:12px}
.bill .tot{border-top:1px dashed var(--line-2);padding-top:8px;font-weight:700;font-size:15px}
.slotgrid{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:40px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg);font-family:var(--f-mono);font-size:13px}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden}
.pick button{min-height:44px;padding:8px 12px;background:var(--bg);border:0;border-top:1px solid var(--line);text-align:left;display:flex;justify-content:space-between;gap:8px}
.pick button:first-child{border-top:0}
.pick button:hover{background:var(--surface-2)}
.wk{display:flex;gap:6px;flex-wrap:wrap}
.ticket{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.ticket .tp{padding:16px;display:flex;flex-direction:column;gap:6px}
.ticket .tq{padding:16px;border-top:1px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;gap:8px}
.qrbox{background:#fff;padding:10px;border-radius:8px;width:160px;height:160px;display:grid;place-items:center;color:#111;font-size:12px;text-align:center}
.qrbox svg{width:100%;height:100%;display:block}
pre.json{margin:0;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);font:12px/1.5 var(--f-mono);overflow-x:auto;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:90;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--accent);font-size:13px}
.toast small{display:block;color:var(--muted);margin-top:2px}
.cfgf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 14px;align-items:center}
.cfgf .k{font-size:13px}
.cfgf .k small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}

@media (max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .field:first-child{grid-column:1/-1}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .top{padding:10px 16px}
  .top .brand{display:flex;padding:0}
  .top h1{display:none}
  .page{padding:16px;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--rail);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{min-height:52px;background:none;border:0;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
  .bnav button[aria-current="page"]{color:var(--fg);background:var(--accent-soft)}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .ov{align-items:flex-end}
  .sheet{width:100%;height:auto;max-height:94%;border-left:0;border-top:1px solid var(--line-2);border-radius:16px 16px 0 0}
  .ov.dlg{align-items:flex-end;padding:0}
  .dlgbox{width:100%;max-height:94%;border-radius:16px 16px 0 0;border-bottom:0}
  .li-bk{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm st" "dt pr" "hc hc";gap:4px 12px}
  .li-bk.hd{display:none}
  .c-tb{display:none}
  .c-dt .tbi{display:inline}
  .c-pr{text-align:right}
  .li-today{grid-template-columns:84px minmax(0,1fr) auto;padding:12px}
  .li-mem{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .li-mem>*:nth-child(n+3){grid-column:1/-1}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:96px minmax(0,1fr)}
  .cfgf{grid-template-columns:minmax(0,1fr)}
  .chip.hide-sm,.route.hide-sm{display:none}
}
@media (max-width:520px){.grid2,.grid3,.toolbar{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:24px}.li-kv{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== rapport-style layer: soft big radii, floating dock, pill tabs, tiles. Space8 colours kept (black + #25D366). ===== */
:root{--r:24px;--r-btn:999px;--r-sm:14px;--glow:radial-gradient(900px 480px at 6% -10%,rgba(37,211,102,.11),transparent 62%)}
:root[data-theme="light"]{--glow:radial-gradient(900px 480px at 6% -10%,rgba(18,140,74,.10),transparent 62%)}
body{background:var(--glow),var(--bg);background-attachment:fixed}
.app{display:block}
.rail{display:none}
.main{max-width:1320px;margin:0 auto;padding:0 28px 48px 100px}
.top{position:static;border:0;background:none;backdrop-filter:none;padding:18px 0 4px;gap:12px;flex-wrap:wrap}
.top .brand.logo-h{display:flex;padding:0;margin-right:8px}
.top .brand.logo-m{display:none}
.logo-h svg{height:26px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:2px}
.tabs button{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:none;color:var(--fg-2);font-weight:500;white-space:nowrap}
.tabs button svg{display:none}
.tabs button:hover{color:var(--fg);background:var(--surface)}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.thead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:18px 0 0}.ptitle{font:600 36px/1.1 var(--f-body);letter-spacing:-.5px;margin:0}
.page{padding:14px 0 0;max-width:none;gap:22px}
.head h2{font:600 17px var(--f-body)}

.dock{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;background:#0b0b0b;border:1px solid var(--line-2);border-radius:999px}
.dock button{width:44px;height:44px;border-radius:50%;border:0;background:none;color:rgba(255,255,255,.7);display:grid;place-items:center}
.dock button:hover{background:rgba(255,255,255,.1);color:#fff}
.dock button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.dock button.primary{background:var(--accent);color:#000}
.dock button.primary:hover{background:var(--accent-hover)}
.dock hr{width:24px;border:0;border-top:1px solid rgba(255,255,255,.16);margin:4px 0}

.card{border-radius:var(--r);padding:20px}
.card.flat{padding:0}
.btn{border-radius:999px}
.sel{border-radius:999px;padding:0 16px}
.icon-btn{border-radius:50%}
.field input[type=search]{border-radius:999px;padding-left:18px}
.seg{border-radius:999px;padding:4px}
.seg button{border-radius:999px;min-height:36px;padding:0 16px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none;font-weight:600}
.slot,.pick{border-radius:14px}

.stats{display:flex;flex-wrap:wrap;gap:14px 32px}
.stat{flex-direction:row;align-items:center;gap:12px;padding:0;border:0;background:none}
.stat .ci{width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none;font-style:normal}
.stat .tx{display:flex;flex-direction:column;min-width:0}
.stat b{font:400 36px/1 var(--f-display);letter-spacing:.5px}

.stack{display:grid;gap:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:16px}
.tiles .empty{grid-column:1/-1}
.tile{display:flex;flex-direction:column;gap:2px;min-height:136px;padding:14px 16px;border-radius:22px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);text-align:left;width:100%}
.tile:hover{border-color:var(--line-2)}
.tile .t1{font-size:12px;color:var(--muted)}

function busy(date,table,exceptId){
 const s=new Set();
 DB.bookings.forEach(b=>{if(b.id===exceptId||b.date!==date||b.table!==table||!['confirmed','pending'].includes(b.status))return;const a=Math.floor(hm(b.start)/60);for(let h=a;h<a+b.hours;h++)s.add(h)});
 DB.maint.forEach(m=>{if(m.date!==date||(m.table&&m.table!==table))return;const a=m.start?Math.floor(hm(m.start)/60):0,z=m.end?Math.ceil(hm(m.end)/60):24;for(let h=a;h<z;h++)s.add(h)});
 return s;
}
function startsFor(date,table,hours,exceptId){
 const s=busy(date,table,exceptId),o=DB.config.site.openHour,c=DB.config.site.closeHour,out=[];
 for(let h=o;h+hours<=c;h++){if(date===TODAY&&h*60<NOWM)continue;let ok=true;for(let k=0;k<hours;k++)if(s.has(h+k)){ok=false;break}if(ok)out.push(h)}
 return out;
}

function doResched(){
 const d=S.dlg,b=bk(d.id),m=mem(b.uid);
 if(canResched(b))return fail(canResched(b));
 if(!startsFor(d.date,d.table,b.hours,b.id).includes(d.sh))return fail('此時段剛被佔用，請重新選擇');
 const before={date:b.date,start:b.start,table:b.table};
 b.date=d.date;b.start=tm(d.sh*60);b.table=d.table;b.resched++;
 audit('booking.reschedule','bookings',b.id,before,{date:b.date,start:b.start,table:b.table,reason:'惡劣天氣特殊安排',whatsapp:d.wa});
 notify(b.uid,'預約已改期','因惡劣天氣，你的預約已改至 '+dlabel(b.date)+' '+b.start+'–'+endOf(b)+'（枱 '+b.table+'）。如有疑問，請聯絡 Space8。','system');
 S.dlg=null;render();toast('已改期','已自動發送 inbox 通知給 '+m.name);
}
function doWCancel(){
 const d=S.dlg,b=bk(d.id),m=mem(b.uid),amt=Math.round(Number(d.amt));
 if(canCancel(b))return fail(canCancel(b));
 const earned=DB.pts.filter(x=>x.ref===b.id&&x.type==='booking').reduce((a,x)=>a+x.points,0);
 const before={status:b.status};
 b.status='admin_cancelled';b.cancelReason='惡劣天氣特殊安排';
 if(earned>0)addPts(b.uid,-earned,'reversal','取消回收積分',b.id);
 if(amt>0)addCred(b.uid,amt,'refund','惡劣天氣取消補償 '+b.ref,b.id,null,cur().email);
 audit('booking.cancel_credit','bookings',b.id,before,{status:b.status,credit:amt,points_reversed:earned,reason:'惡劣天氣特殊安排',whatsapp:d.wa,amount_note:d.why||undefined});
 notify(b.uid,'預約已取消，Credit 已存入','因惡劣天氣，你的預約 '+b.hc+'（'+dlabel(b.date)+' '+b.start+'）已取消，'+(amt>0?money(amt)+' 已存入你的 Space Credit 錢包。':'本次沒有 Credit 補償。'),'credit');
 S.dlg=null;render();toast('已取消並補 Credit',money(amt)+' 已存入 '+m.name+' 的錢包');
}
function doNewBk(){

 const b=mkB({date:d.date,start:tm(d.sh*60),hours:d.hours,table:d.table,uid:d.uid,created:stamp(),pay:d.free?'free':d.pay,free:d.free,note:d.free?'免費原因：'+d.why:'手動新增'});

function validNewBk(d){

}

 case 'mt-add':{const f=S.mt;S.mtErr='';
  if(!f.date||f.date<TODAY){S.mtErr='請選擇今日或之後的日期';return render()}
  if(!!f.start!==!!f.end){S.mtErr='開始與結束時間必須同時填寫，或同時留空（全日）';return render()}
  if(f.start&&f.start>=f.end){S.mtErr='結束時間必須晚於開始時間';return render()}
  const tb=Number(f.table)||null,a=f.start?hm(f.start):0,z=f.end?hm(f.end):1440;
  const hit=DB.bookings.filter(b=>b.date===f.date&&['confirmed','pending'].includes(b.status)&&(!tb||b.table===tb)&&hm(b.start)<z&&hm(b.start)+b.hours*60>a);
  if(hit.length&&!S.mtWarn){S.mtWarn='此時段已有 '+hit.length+' 個預約。封枱不會自動取消或改期這些預約，請先處理。';return render()}
  const row={id:nid('mt'),date:f.date,table:tb,start:f.start||null,end:f.end||null,reason:f.reason.trim()};DB.maint.push(row);
  audit('maintenance.add','maintenance_log',row.id,null,row);S.mt=null;S.mtWarn='';render();toast('已新增封枱');break}
 case 'mt-del':{const i=DB.maint.findIndex(x=>x.id===id),r=DB.maint[i];DB.maint.splice(i,1);audit('maintenance.remove','maintenance_log',id,r,null);render();toast('已移除封枱');break}
 case 'msg-save':{const nv=(S.msg!=null?S.msg:DB.config.maintenance.message).trim();if(!nv)return toast('公告不可留空');if(nv===DB.config.maintenance.message)return toast('公告沒有更改');
  audit('config.update','config','maintenance.message',{message:DB.config.maintenance.message},{message:nv});DB.config.maintenance.message=nv;S.msg=null;render();toast('維修公告已儲存');break}
 case 'pay-toggle':{const p=DB.pay.find(x=>x.method===id);if(p.on&&DB.pay.filter(x=>x.on).length===1)return toast('至少要保留一種付款方式');
  audit('payment_settings.toggle','payment_settings',p.method,{enabled:p.on},{enabled:!p.on});p.on=!p.on;render();toast(p.label+(p.on?' 已開啟':' 已關閉'));break}
 case 'promo-toggle':{const p=DB.promos.find(x=>x.id===id);audit('promo.toggle','promotion_codes',p.code,{is_active:p.on},{is_active:!p.on});p.on=!p.on;render();toast(p.code+(p.on?' 已啟用':' 已停用'));break}
 case 'promo-new':S.dlg={type:'promo',edit:false,code:'',name:'',dt:'percentage',value:'',maxDisc:'',minCart:'',from:TODAY,until:addDays(TODAY,30),maxUses:'',perUser:'1',weekdays:[],ws:'',we:'',stackCredit:false,stackCodes:false,wallet:true,err:''};renderOv();break;
 case 'promo-edit':{const p=DB.promos.find(x=>x.id===id);S.dlg={type:'promo',edit:true,id,code:p.code,from:p.from,until:p.until,maxUses:String(p.maxUses||''),perUser:String(p.perUser||''),err:''};renderOv();break}
 case 'promo-wd':{const w=Number(el.dataset.w),i=d.weekdays.indexOf(w);if(i<0)d.weekdays.push(w);else d.weekdays.splice(i,1);rerenderDlg();break}
 case 'promo-flag':d[el.dataset.f]=!d[el.dataset.f];rerenderDlg();break;
 case 'promo-go':{
  if(!d.from||!d.until||d.until<d.from)return fail('結束日期不可早於開始日期');
  const mu=d.maxUses===''?0:Math.round(Number(d.maxUses)),pu=d.perUser===''?0:Math.round(Number(d.perUser));
  if(!(mu>=0)||!(pu>=0))return fail('使用上限必須是 0 或以上的整數');
  if(d.edit){const p=DB.promos.find(x=>x.id===d.id),bf={from:p.from,until:p.until,maxUses:p.maxUses,perUser:p.perUser};
   if(mu&&mu<p.used)return fail('使用上限不可低於已使用次數（'+p.used+'）');
   p.from=d.from;p.until=d.until;p.maxUses=mu;p.perUser=pu;audit('promo.update','promotion_codes',p.code,bf,{from:p.from,until:p.until,maxUses:p.maxUses,perUser:p.perUser});S.dlg=null;render();toast('已更新 '+p.code);break}
  const code=d.code.trim().toUpperCase(),val=Number(d.value);
  if(!/^[A-Z0-9]{3,20}$/.test(code))return fail('優惠碼只可使用 3 至 20 個英文字母或數字');
  if(DB.promos.some(x=>x.code===code))return fail('此優惠碼已存在');
  if(!d.name.trim())return fail('請填寫名稱');
  if(!(val>0))return fail('折扣數值必須大於 0');
  if(d.dt==='percentage'&&val>100)return fail('百分比折扣不可超過 100');
  if((d.ws&&!d.we)||(!d.ws&&d.we)||(d.ws&&d.ws>=d.we))return fail('指定時段需要開始與結束時間，且結束晚於開始');
  const row={id:nid('p'),code,name:d.name.trim(),type:d.dt,value:val,maxDisc:Number(d.maxDisc)||0,minCart:Number(d.minCart)||0,from:d.from,until:d.until,maxUses:mu,used:0,perUser:pu,weekdays:d.weekdays.slice(),win:d.ws?[d.ws,d.we]:null,audience:'all',aud:0,stackCredit:d.stackCredit,stackCodes:d.stackCodes,wallet:d.wallet,on:true};
  DB.promos.unshift(row);audit('promo.create','promotion_codes',code,null,clone(row));S.dlg=null;render();toast('已建立優惠碼 '+code);break}
 /* system */
 case 'admin-invite':if(needSuper())break;S.dlg={type:'invite',email:'',role:'admin',err:''};renderOv();break;
 case 'invite-go':{if(needSuper())break;const em=d.email.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em))return fail('電郵格式不正確');
  const ex=DB.admins.find(x=>x.email===em),exp=addDays(TODAY,1)+' '+tm(NOWM);
  if(ex&&ex.status==='active')return fail('此電郵已是管理員');
  if(ex){ex.role=d.role;ex.status='pending';ex.exp=exp}else DB.admins.push({id:nid('a'),email:em,role:d.role,status:'pending',exp});
  audit('admin.invite','admin_users',em,null,{role:d.role,invited_by:cur().email});S.dlg=null;render();toast('邀請已建立','邀請信會寄到 '+em+'，24 小時內有效');break}
 case 'admin-resend':{if(needSuper())break;const x=DB.admins.find(y=>y.id===id);const was=x.status;x.status='pending';x.exp=addDays(TODAY,1)+' '+tm(NOWM);audit('admin.invite','admin_users',x.email,{invite_status:was},{invite_status:'pending',expires:x.exp});render();toast(was==='revoked'?'已重新邀請':'邀請已重新發送');break}
 case 'admin-revoke':{if(needSuper())break;const x=DB.admins.find(y=>y.id===id);
  if(x.id===cur().id)return toast('不能撤銷自己的帳戶');
  if(x.role==='super_admin'&&DB.admins.filter(y=>y.role==='super_admin'&&y.status==='active').length<=1)return toast('不能撤銷最後一個超級管理員');
  audit('admin.revoke','admin_users',x.email,{invite_status:'active'},{invite_status:'revoked'});x.status='revoked';render();toast(x.email+' 已撤銷');break}
 case 'err-done':{const x=DB.errors.find(y=>y.id===id);x.done=true;audit('error.resolve','site_error_log',x.id,{resolved:false},{resolved:true});render();toast('已標記已解決');break}
 }
});

/* inputs: keep text typing free of re-renders */
document.addEventListener('input',e=>{
 const t=e.target,d=S.dlg;
 if(t.dataset.bind!==undefined){
  const p=t.dataset.bind;
  if(p==='noteDraft')S.noteDraft={id:t.dataset.nid,v:t.value};else if(p==='msg')S.msg=t.value;else setPath(S,p,t.value);
  if(t.dataset.live==='bk'){S.bk.page=1;$('#bk-res').innerHTML=bkResults()}
  if(t.dataset.live==='mem')$('#mem-res').innerHTML=memResults();
 }
 if(t.dataset.cfg){const k=t.dataset.cfg,dr=cfgDraft(k),orig=getPath(DB.config[k],t.dataset.p);setPath(dr,t.dataset.p,typeof orig==='number'?(Number(t.value)||0):t.value);const sv=document.querySelector('[data-act="cfg-save"][data-k="'+k+'"]');if(sv)sv.disabled=!cfgDirty(k)}
 if(t.dataset.d&&d){
  d[t.dataset.d]=t.dataset.num?Number(t.value):t.value;
  if(t.dataset.live==='nb')$('#nb-res').innerHTML=nbRes(d);
  if(d.type==='wcancel'&&t.dataset.d==='amt'){const b=bk(d.id),w=$('#amt-why');if(w)w.hidden=Number(d.amt)===b.total&&d.amt!==''}
 }
});
document.addEventListener('change',e=>{
 const t=e.target,d=S.dlg;
 if(t.id==='role-sel'){S.role=t.value;S.drawer=null;S.dlg=null;render();toast('已切換為'+(S.role==='super_admin'?'超級管理員':'管理員'),'預覽權限差異');return}
 if(t.dataset.rerender)render();
 if(t.dataset.bind&&t.dataset.bind.indexOf('mt.')===0&&(S.mtWarn||S.mtErr)){S.mtWarn='';S.mtErr='';render()}
 if(t.dataset.d&&d&&['d-date','d-tb','d-hr'].includes(t.id)){
  d[t.dataset.d]=t.dataset.num?Number(t.value):t.value;
  if(t.id==='d-date'||t.id==='d-tb'){d.sh=null;if(d.type==='newbk')d.hours=1;if(d.type==='resched')d.table=null}
  rerenderDlg();
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.dlg){S.dlg=null;renderOv()}else if(S.drawer){S.drawer=null;render()}}});
$('#theme-btn').addEventListener('click',()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';$('#theme-btn').innerHTML=themeIcon()});
render();

</script>
