<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Changed — Space8</title>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;">
  <!-- Starfield background effect -->
  <div style="position: fixed; inset: 0; overflow: hidden; pointer-events: none;">
    <div style="position: absolute; width: 1px; height: 1px; background: white; opacity: 0.6; top: 10%; left: 20%; box-shadow: 0 0 2px white;"></div>
    <div style="position: absolute; width: 1px; height: 1px; background: white; opacity: 0.4; top: 30%; left: 70%; box-shadow: 0 0 1px white;"></div>
    <div style="position: absolute; width: 1px; height: 1px; background: white; opacity: 0.5; top: 60%; left: 40%; box-shadow: 0 0 1px white;"></div>
    <div style="position: absolute; width: 1px; height: 1px; background: white; opacity: 0.7; top: 80%; left: 85%; box-shadow: 0 0 2px white;"></div>
    <div style="position: absolute; width: 1px; height: 1px; background: white; opacity: 0.3; top: 45%; left: 15%; box-shadow: 0 0 1px white;"></div>
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto; padding: 48px 24px;">
    <tr>
      <td style="text-align: center; padding-bottom: 40px;">
        <img src="https://248.formhk.com/logos/space8-logo-email.png" alt="Space8" width="320" style="max-width: 100%; height: auto; display: block; margin: 0 auto;" />
      </td>
    </tr>

    <tr>
      <td style="background-color: #0a0a0a; border-radius: 24px; padding: 48px 40px; border: 1px solid rgba(34, 197, 94, 0.2);">
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="display: inline-block; background: rgba(34, 197, 94, 0.15); border-radius: 50%; width: 64px; height: 64px; line-height: 64px;">
            <span style="color: #22c55e; font-size: 32px;">✓</span>
          </div>
        </div>

        <h2 style="color: #ffffff; font-size: 24px; font-weight: 600; margin: 0 0 16px; text-align: center;">
          Email Address Changed
        </h2>
        <p style="color: #a3a3a3; font-size: 15px; line-height: 1.6; margin: 0 0 32px; text-align: center;">
          Your Space8 account email address was changed successfully.
        </p>

        <div style="background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 12px; padding: 20px; margin-bottom: 32px;">
          <p style="color: #a3a3a3; font-size: 13px; margin: 0 0 8px;">
            <strong style="color: #ffffff;">New Email:</strong> {{ .NewEmail }}
          </p>
          <p style="color: #a3a3a3; font-size: 13px; margin: 0 0 8px;">
            <strong style="color: #ffffff;">Time:</strong> {{ .Time }}
          </p>
          <p style="color: #a3a3a3; font-size: 13px; margin: 0;">
            <strong style="color: #ffffff;">IP Address:</strong> {{ .IPAddress }}
          </p>
        </div>

        <p style="color: #737373; font-size: 14px; line-height: 1.6; text-align: center; margin: 0;">
          If you didn't make this change, please contact support immediately to secure your account.
        </p>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="padding-top: 32px;">
        <p style="color: #525252; font-size: 12px; text-align: center; margin: 0;">
          Space8 · Hong Kong
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
